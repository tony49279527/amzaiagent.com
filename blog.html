<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Competitor Analysis Assistant</title>
    <meta name="description"
        content="Read the latest articles on Amazon selling strategies, competitor analysis tips, and e-commerce market insights from Amz AI Agent.">

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://amzaiagent.com/blog.html">
    <link rel="alternate" type="application/atom+xml" href="https://amzaiagent.com/feed.xml">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><path d=%22M50 20 L20 80 H35 L42 65 H58 L65 80 H80 L50 20 Z M45 58 L50 45 L55 58 H45 Z%22 fill=%22white%22/></svg>">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Blog - Competitor Analysis Assistant | Amz AI Agent">
    <meta property="og:description"
        content="Read the latest articles on Amazon selling strategies, competitor analysis tips, and e-commerce market insights from Amz AI Agent.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amzaiagent.com/blog.html">
    <meta property="og:image" content="https://amzaiagent.com/images/about_hero.webp">
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1 class="page-title">Blog</h1>
            <p class="page-subtitle">Deep insights into Amazon operations, AI tools, and market trends</p>
        </div>
    </header>

    <!-- CTA strip to main funnels -->
    <section class="container" style="margin-bottom: 2rem;">
        <div class="form-card"
            style="display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 1rem; align-items: center;">
            <div>
                <h2 style="margin:0 0 0.25rem 0;">Ready to act on these insights?</h2>
                <p style="color: var(--text-secondary); margin:0;">Run a free competitor analysis or try product
                    discovery now.</p>
            </div>
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                <a class="btn btn-primary" href="create.html">Start Competitor Analysis</a>
                <a class="btn btn-secondary" href="discovery.html">Explore Product Discovery</a>
            </div>
        </div>
    </section>

    <!-- Content -->
    <main class="container">
        <div class="content-grid" id="blog-grid">
            <!-- Dynamically loaded -->
            <div class="loading-state" style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: #64748b;">
                Loading articles...
            </div>
        </div>
    </main>

    <!-- Load Blog Data with Cache Busting -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Dynamic loader to force fresh data
            const script = document.createElement('script');
            script.src = `data/blog/blog_posts.js?v=${new Date().getTime()}`;
            script.onload = initBlog;
            document.head.appendChild(script);

            function initBlog() {
                const grid = document.getElementById('blog-grid');
                const rawPosts = window.blogPostsEN || [];
                const posts = buildCuratedPosts(rawPosts);

                grid.innerHTML = '';

                if (posts.length === 0) {
                    grid.innerHTML = '<p>No articles found.</p>';
                    return;
                }

                // Featured post (first one)
                const featured = posts[0];
                const featuredHTML = `
                <div class="featured-post">
                    <a href="blog-post.html?id=${featured.id}" class="card-link">
                        <article class="card">
                            <div class="card-image-wrapper">
                                <div style="width: 100%; height: 100%; background: linear-gradient(135deg, #fce7f3 0%, #e0e7ff 100%);">
                                    <img src="${(featured.cover_image || '').replace('.png', '.webp')}" style="width:100%;height:100%;object-fit:cover;" alt="Featured" loading="lazy" onerror="this.style.display='none'">
                                </div>
                            </div>
                            <div class="card-content">
                                <span class="card-tag">${featured.tags[0] || 'Featured'}</span>
                                <h3 class="card-title">${featured.display_title || featured.title}</h3>
                                <p class="card-desc">${stripHtml(featured.content).substring(0, 150)}...</p>
                                <div class="card-footer">
                                    <span>📅 ${featured.date}</span>
                                    <span>⏱️ 5 Min Read</span>
                                </div>
                            </div>
                        </article>
                    </a>
                </div>
                `;
                grid.innerHTML += featuredHTML;

                // Rest of posts
                const otherPosts = posts.slice(1);
                otherPosts.forEach(post => {
                    const html = `
                    <a href="blog-post.html?id=${post.id}" class="card-link">
                        <article class="card">
                            <div class="card-image-wrapper">
                                <div style="width: 100%; height: 100%; background-color: #f1f5f9;">
                                    <img src="${(post.cover_image || '').replace('.png', '.webp')}" style="width:100%;height:100%;object-fit:cover;" alt="${post.display_title || post.title}" loading="lazy" onerror="this.style.display='none'">
                                </div>
                            </div>
                            <div class="card-content">
                                <span class="card-tag">${post.tags[0] || 'Article'}</span>
                                <h3 class="card-title">${post.display_title || post.title}</h3>
                                <p class="card-desc">${stripHtml(post.content).substring(0, 120)}...</p>
                                <div class="card-footer">
                                    <span>📅 ${post.date}</span>
                                </div>
                            </div>
                        </article>
                    </a>
                    `;
                    grid.appendChild(document.createRange().createContextualFragment(html));
                });
            }

            function buildCuratedPosts(posts) {
                const sorted = [...posts].sort((a, b) => parseDateToTs(b.date) - parseDateToTs(a.date));
                const seenTopics = new Set();
                const curated = [];

                sorted.forEach(post => {
                    const topicKey = getTopicKey(post);
                    if (seenTopics.has(topicKey)) return;
                    seenTopics.add(topicKey);
                    curated.push({
                        ...post,
                        display_title: normalizeTitleYear(post.title, post.date)
                    });
                });

                return curated;
            }

            function getTopicKey(post) {
                const normalized = normalizeTitle(post.title || '');
                const dedupeRules = [
                    { key: 'topic-safe-t-window', pattern: /safe t claims window/ },
                    { key: 'topic-bsa-compliance', pattern: /bsa compliance/ },
                    { key: 'topic-gmv-growth', pattern: /gmv growth/ },
                    { key: 'topic-seller-registration-drop', pattern: /seller registrations? drop/ },
                    { key: 'topic-dd7-disbursement', pattern: /dd 7|disbursement policy change/ }
                ];

                for (const rule of dedupeRules) {
                    if (rule.pattern.test(normalized)) return rule.key;
                }

                return `post-${post.id}`;
            }

            function normalizeTitle(title) {
                return (title || '')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function normalizeTitleYear(title, dateText) {
                const publishYear = new Date(dateText || '').getFullYear();
                if (!Number.isFinite(publishYear)) return title;

                return (title || '').replace(/\b20\d{2}\b/g, (yearText) => {
                    const year = Number(yearText);
                    const gap = publishYear - year;
                    if (gap >= 2 && gap <= 3) {
                        return String(publishYear);
                    }
                    return yearText;
                });
            }

            function parseDateToTs(dateText) {
                const ts = Date.parse(dateText || '');
                return Number.isNaN(ts) ? 0 : ts;
            }

            function stripHtml(html) {
                let tmp = document.createElement("DIV");
                tmp.innerHTML = html;
                // Try to find the first paragraph
                let firstP = tmp.querySelector("p");
                if (firstP) {
                    return firstP.textContent || firstP.innerText || "";
                }
                // Fallback to all text if no p tag found
                return tmp.textContent || tmp.innerText || "";
            }
        });
    </script>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src='js/components.js'></script>
    <script src="script_v2.js?v=5"></script>
</body>

</html>
