    <!-- Load Data with Cache Busting -->
    <script>
        // Smart back button logic
        function initBackButton() {
            const backBtn = document.getElementById('back-to-list');
            if (!backBtn) return;

            backBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const referrer = document.referrer || '';
                if (referrer.includes('blog')) {
                    history.back();
                } else {
                    window.location.href = 'blog.html';
                }
            });
        }

        function updateBreadcrumbTitle(title) {
            const breadcrumbTitle = document.getElementById('breadcrumb-title');
            if (breadcrumbTitle && title) {
                breadcrumbTitle.textContent = title;
                breadcrumbTitle.title = title;
            }
        }

        function stripHtml(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            let firstP = tmp.querySelector("p");
            if (firstP) {
                return firstP.textContent || firstP.innerText || "";
            }
            return tmp.textContent || tmp.innerText || "";
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeHtml(html) {
            const container = document.createElement('div');
            container.innerHTML = html || '';

            // Remove high-risk tags completely.
            container.querySelectorAll('script, iframe, object, embed, link, meta, style').forEach(el => el.remove());

            // Strip event handlers and javascript: URLs.
            container.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = (attr.value || '').trim().toLowerCase();
                    if (name.startsWith('on')) {
                        el.removeAttribute(attr.name);
                        return;
                    }
                    if ((name === 'href' || name === 'src') && value.startsWith('javascript:')) {
                        el.removeAttribute(attr.name);
                    }
                });
            });

            return container.innerHTML;
        }

        function localizeExternalImages(html, fallbackImage) {
            const container = document.createElement('div');
            container.innerHTML = html || '';
            const fallback = (fallbackImage || '').replace('.png', '.webp');
            container.querySelectorAll('img').forEach(img => {
                const src = (img.getAttribute('src') || '').trim();
                if (/^https?:\/\//i.test(src) && fallback) {
                    img.setAttribute('src', fallback);
                }
                img.setAttribute('loading', 'lazy');
            });
            return container.innerHTML;
        }

        function normalizeTitle(title) {
            return (title || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function inferTopicKeyFromText(value) {
            const normalized = normalizeTitle(value || '');
            const dedupeRules = [
                { key: 'topic-safe-t-window', pattern: /safe t claims window/ },
                { key: 'topic-bsa-compliance', pattern: /bsa compliance|seller tool compliance|bsa rules?/ },
                { key: 'topic-gmv-growth', pattern: /gmv growth/ },
                { key: 'topic-seller-registration-drop', pattern: /seller registrations? drop/ },
                { key: 'topic-dd7-disbursement', pattern: /dd 7|disbursement policy change/ }
            ];

            for (const rule of dedupeRules) {
                if (rule.pattern.test(normalized)) return rule.key;
            }

            return null;
        }

        function getTopicKey(post) {
            return inferTopicKeyFromText(post.title || '') || `post-${post.id}`;
        }

        function parseDateToTs(dateText) {
            const ts = Date.parse(dateText || '');
            return Number.isNaN(ts) ? 0 : ts;
        }

        function injectSchema(post) {
            const ld = {
                "@context": "https://schema.org",
                "@type": "Article",
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": `https://amzaiagent.com/blog-post.html?id=${post.id}`
                },
                "headline": post.title,
                "description": stripHtml(post.content || "").substring(0, 300),
                "datePublished": post.date || new Date().toISOString(),
                "dateModified": post.date || new Date().toISOString(),
                "author": {
                    "@type": "Organization",
                    "name": post.author || "Amz AI Agent"
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "Amz AI Agent",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "https://amzaiagent.com/assets/images/logo_final.svg"
                    }
                },
                "image": post.cover_image ? post.cover_image.replace('.png', '.webp') : undefined
            };
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify(ld);
            document.head.appendChild(script);
        }

        // 301 redirect: duplicate blog URLs → canonical (SEO consolidation)
        var BLOG_301_MAP = {
            'amazon-bsa-compliance-2024-seller-tools-ai': 'amazon-bsa-compliance-update-2024-seller-tools-ai',
            'amazon-bsa-compliance-2024-seller-tools-deadline': 'amazon-bsa-compliance-update-2024-seller-tools-ai',
            'amazon-bsa-compliance-update-2024-fba-sellers': 'amazon-bsa-compliance-update-2024-seller-tools-ai',
            'amazon-seller-tool-compliance-2024-bsa-rules': 'amazon-bsa-compliance-update-2024-seller-tools-ai',
            'amazon-safe-t-claims-window-30-days-2026': 'amazon-safe-t-claims-window-2026-update-fba-sellers',
            'amazon-safe-t-claims-window-30-days-2026-update': 'amazon-safe-t-claims-window-2026-update-fba-sellers',
            'amazon-safe-t-claims-window-change-2026': 'amazon-safe-t-claims-window-2026-update-fba-sellers',
            'amazon-safe-t-claims-window-changes-2026': 'amazon-safe-t-claims-window-2026-update-fba-sellers',
            'amazon-safe-t-claims-window-reduction-2026': 'amazon-safe-t-claims-window-2026-update-fba-sellers',
            'amazon-gmv-growth-2025-record-milestone': 'amazon-gmv-growth-2025-milestone',
            'amazon-gmv-growth-2025-sales-impact-fba-sellers': 'amazon-gmv-growth-2025-milestone',
            'amazon-gmv-growth-2025-seller-impact': 'amazon-gmv-growth-2025-milestone',
            'amazon-fba-shipping-costs-2026-protect-profit-margins': 'amazon-fba-shipping-cost-increases-2026-protect-margins',
            'amazon-seller-registrations-2025-drop-fba-impact': 'amazon-seller-registration-drop-2025-fba-impact',
            'amazon-disbursement-policy-changes-dd7-2024': 'amazon-dd7-disbursement-policy-change-2024',
            'ai-inventory-forecasting-amazon-fba-stockouts-overstock': 'ai-inventory-forecasting-amazon-fba-guide'
        };

        document.addEventListener('DOMContentLoaded', () => {
            initBackButton();

            const articleContent = document.getElementById('article-content');
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (postId && BLOG_301_MAP[postId]) {
                const canonicalUrl = '/blog/' + encodeURIComponent(BLOG_301_MAP[postId]) + '.html';
                window.location.replace(canonicalUrl);
                return;
            }

            if (!postId) {
                articleContent.innerHTML = '<div style="text-align: center; padding: 4rem;">Article not found (No ID)</div>';
                return;
            }

            // Load blog posts from local JS file (Static Site Generator approach)
            // The Python bot updates this file automatically

            const script = document.createElement('script');
            script.src = `data/blog/blog_posts.js?v=${new Date().getTime()}`;
            script.onload = () => {
                // blog_posts.js sets window.blogPostsEN
                const posts = window.blogPostsEN || [];
                const topicLeaders = new Map();
                [...posts]
                    .sort((a, b) => parseDateToTs(b.date) - parseDateToTs(a.date))
                    .forEach(p => {
                        const key = getTopicKey(p);
                        if (!topicLeaders.has(key)) topicLeaders.set(key, p);
                    });

                // Logic to find post by ID or Slug
                let post = posts.find(p => p.id === postId);
                if (!post && window.location.search.includes('slug')) {
                    const slug = new URLSearchParams(window.location.search).get('slug');
                    post = posts.find(p => p.slug === slug || p.id === slug);
                }
                // Also try matching by id as slug
                if (!post) {
                    post = posts.find(p => p.id === postId || p.slug === postId);
                }

                if (!post) {
                    const requestedSlug = new URLSearchParams(window.location.search).get('slug') || postId;
                    const inferredTopicKey = inferTopicKeyFromText(requestedSlug);
                    const canonicalPost = inferredTopicKey ? topicLeaders.get(inferredTopicKey) : null;
                    if (canonicalPost && canonicalPost.id) {
                        const canonicalUrl = `/blog/${encodeURIComponent(canonicalPost.id)}.html`;
                        window.location.replace(canonicalUrl);
                        return;
                    }
                    articleContent.innerHTML = '<div style="text-align: center; padding: 4rem;">Article not found</div>';
                    return;
                }

                // Canonicalize duplicate topic URLs to the newest post, reducing SEO cannibalization.
                const canonicalPostForCurrent = topicLeaders.get(getTopicKey(post));
                if (canonicalPostForCurrent && canonicalPostForCurrent.id && canonicalPostForCurrent.id !== post.id) {
                    const canonicalUrl = `/blog/${encodeURIComponent(canonicalPostForCurrent.id)}.html`;
                    window.location.replace(canonicalUrl);
                    return;
                }

                // Redirect successful match to the new static SSG page
                window.location.replace(`/blog/${encodeURIComponent(post.id)}.html`);
                return;

                // The rest of the function will not execute.
                const displayTitle = post.title || '';
                const localizedContent = localizeExternalImages(post.content || post.content_html || '', post.cover_image || '');
                const safeContent = sanitizeHtml(localizedContent);
                const safeTitle = escapeHtml(displayTitle);
                const safeTag = escapeHtml((post.tags && post.tags[0]) || '');
                const safeAuthor = escapeHtml(post.author || 'Amz AI Agent');
                const safeDate = escapeHtml(post.date || new Date().toISOString().split('T')[0]);
                const safeCover = (post.cover_image || '').replace('.png', '.webp');

                // Update SEO metadata dynamically
                const pageTitle = `${displayTitle} | Amz AI Agent`;
                document.title = pageTitle;
                const description = safeContent ? stripHtml(safeContent).substring(0, 160) + '...' : displayTitle;
                document.querySelector('meta[name="description"]').setAttribute('content', description);
                document.getElementById('canonical-link').setAttribute('href', `https://amzaiagent.com/blog-post.html?id=${post.id}`);
                injectSchema({ ...post, title: displayTitle, content: safeContent });


                // 1. Render Article
                articleContent.innerHTML = `
                        <article>
                            <header class="article-header">
                                ${post.tags && post.tags.length > 0 ? `<span class="article-tag">${safeTag}</span>` : ''}
                                <h1 class="article-title">${safeTitle}</h1>
                                <div class="article-meta">
                                    <span>📅 ${safeDate}</span>
                                    <span>👤 ${safeAuthor}</span>
                                </div>
                            </header>

                            ${post.cover_image ? `<div class="article-cover-wrapper"><img src="${safeCover}" alt="${safeTitle}" class="article-cover" loading="lazy" onerror="this.style.display='none'"></div>` : ''}

                            <div class="article-content">
                                ${safeContent}
                            </div>

                            <!-- Social Share -->
                            <div class="social-share">
                                <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(displayTitle)}&url=${encodeURIComponent(window.location.href)}" target="_blank" class="social-share-btn twitter">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
                                    Twitter
                                </a>
                                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" target="_blank" class="social-share-btn linkedin">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                                    LinkedIn
                                </a>
                                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="social-share-btn facebook">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.791-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                                    Facebook
                                </a>
                            </div>
                        </article>

                        <!-- Related Posts -->
                            <section class="related-posts">
                                <h3>Read Next</h3>
                                <div class="related-posts-grid" id="related-posts-container">
                                    <!-- JS will populate this -->
                                </div>
                            </section>

                            <section class="cta-panel" style="margin-top:3rem; padding:2rem; border:1px solid var(--border-color); border-radius: 1rem; background: var(--bg-secondary); display:grid; gap:1rem;">
                                <div>
                                    <h3 style="margin:0 0 0.5rem 0;">Turn insights into action</h3>
                                    <p style="margin:0; color: var(--text-secondary);">Run a free competitor analysis or try product discovery now.</p>
                                </div>
                                <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                                    <a class="btn btn-primary" href="create.html">Start Competitor Analysis</a>
                                    <a class="btn btn-secondary" href="discovery.html">Explore Product Discovery</a>
                                </div>
                            </section>
                        `;

                // 2. Populate Related Posts (tag-priority, fallback random)
                const dedupedRelatedPool = [];
                const seenTopics = new Set();
                [...posts]
                    .sort((a, b) => parseDateToTs(b.date) - parseDateToTs(a.date))
                    .forEach(p => {
                        if (p.id === post.id) return;
                        const topicKey = getTopicKey(p);
                        if (seenTopics.has(topicKey)) return;
                        seenTopics.add(topicKey);
                        dedupedRelatedPool.push(p);
                    });

                const otherPosts = dedupedRelatedPool;
                const currentTags = (post.tags || []).map(t => t.toLowerCase());
                const scored = otherPosts.map(p => {
                    const ptags = (p.tags || []).map(t => t.toLowerCase());
                    const overlap = ptags.filter(t => currentTags.includes(t)).length;
                    return { p, score: overlap };
                }).sort((a, b) => b.score - a.score);
                const related = scored
                    .filter(item => item.score > 0)
                    .slice(0, 3)
                    .concat(scored.filter(item => item.score === 0).slice(0, 3 - Math.min(3, scored.filter(i => i.score > 0).length)))
                    .map(item => item.p);

                const relatedContainer = document.getElementById('related-posts-container');
                if (relatedContainer && related.length > 0) {
                    relatedContainer.innerHTML = related.map(p => `
                        <a href="blog-post.html?id=${encodeURIComponent(p.id || '')}" class="related-post-card">
                            <img src="${(p.cover_image || 'assets/images/blog_thumbs/default.webp').replace('.png', '.webp')}" alt="${escapeHtml(p.title || '')}" loading="lazy">
                            <div class="content">
                                <div class="title">${escapeHtml(p.title || '')}</div>
                                <div class="date">${escapeHtml(p.date || '')}</div>
                            </div>
                        </a>
                    `).join('');
                } else if (relatedContainer) {
                    relatedContainer.innerHTML = '<p style="color:var(--text-light)">No related posts found.</p>';
                }

                // 3. Reading Progress Bar Logic
                window.addEventListener('scroll', () => {
                    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scrolled = (winScroll / height) * 100;
                    const progressBar = document.querySelector('.reading-progress');
                    if (progressBar) {
                        progressBar.style.width = scrolled + "%";
                    }
                });
            }; // End script.onload

            document.head.appendChild(script);
        });
    </script>
    <script src='js/components.js'></script>
</body>
