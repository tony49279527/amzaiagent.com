name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Refresh sitemap and feed
      run: |
        python generate_sitemap.py
        python generate_feed.py

    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Deploy to Cloud Run'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: 'amz-ai-replica'
        region: 'us-central1'
        source: '.'
        env_vars: |-
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_SERVER=${{ secrets.SMTP_SERVER }}
          N8N_CHECKOUT_WEBHOOK_URL=${{ secrets.N8N_CHECKOUT_WEBHOOK_URL }}
          N8N_FREE_ANALYSIS_URL=${{ secrets.N8N_FREE_ANALYSIS_URL }}
          N8N_PRO_ANALYSIS_URL=${{ secrets.N8N_PRO_ANALYSIS_URL }}
          N8N_SEND_REPORT_URL=${{ secrets.N8N_SEND_REPORT_URL }}
          N8N_ALLOWED_HOSTS=${{ secrets.N8N_ALLOWED_HOSTS }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
