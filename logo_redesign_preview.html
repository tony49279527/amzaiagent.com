<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <title>Refined Logo Preview | Amz AI Agent</title>
    <style>
        body {
            font-family: system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem;
            background: #f1f5f9;
        }

        .card {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 500px;
        }

        .card img {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        h2 {
            color: #2563eb;
            margin-bottom: 1rem;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .colors {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .swatch {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #475569;
        }

        .color-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>Amz AI Agent</h1>
    <p>Final Refined Logo Design</p>

    <div class="card">
        <img src="assets/images/logo_refined.svg" alt="Refined Logo">
        <h2>"The Pro Smile"</h2>
        <p>这个设计完全按照您的反馈进行了精简。去掉了圆圈和星星，保留了纯粹的 A 字造型，横杠由亚马逊橙色的微笑箭头替代，主色调与您的网站蓝色一致。</p>

        <div class="colors">
            <div class="swatch">
                <div class="color-box" style="background: #2563eb;"></div>
                <span>网站蓝 (#2563eb)</span>
            </div>
            <div class="swatch">
                <div class="color-box" style="background: #FF9900;"></div>
                <span>亚马逊橙 (#FF9900)</span>
            </div>
        </div>
    </div>

    <p style="margin-top: 2rem; font-size: 0.875rem;">如果您还看到旧图，请尝试<strong>强制刷新 (Ctrl+F5 或 Cmd+Shift+R)</strong>。</p>
</body>

</html>
