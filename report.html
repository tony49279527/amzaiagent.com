<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Analysis Report | Amz AI Agent</title>
    <meta name="description" id="meta-description"
        content="Detailed AI competitor analysis report with insights on customer pain points, feature gaps, and listing optimization recommendations for Amazon sellers.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" id="canonical-link" href="https://amzaiagent.com/report.html">

    <!-- Open Graph -->
    <meta property="og:title" content="Analysis Report | Amz AI Agent">
    <meta property="og:description"
        content="Deep-dive competitor analysis with actionable insights for Amazon sellers.">
    <meta property="og:type" content="article">
    <meta property="og:image" content="https://amzaiagent.com/assets/images/logo_final.svg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Analysis Report | Amz AI Agent">

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><path d=%22M50 20 L20 80 H35 L42 65 H58 L65 80 H80 L50 20 Z M45 58 L50 45 L55 58 H45 Z%22 fill=%22white%22/></svg>">
    <link rel="stylesheet" href="styles.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Report Content -->
    <main class="report-main">
        <div class="container">
            <!-- Breadcrumb Navigation -->
            <nav class="breadcrumb-bar" aria-label="Breadcrumb">
                <a href="#" id="back-to-cases" class="breadcrumb-back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5" />
                        <path d="M12 19l-7-7 7-7" />
                    </svg>
                    Back to Cases
                </a>
                <ol class="breadcrumb-path">
                    <li><a href="index.html">Home</a></li>
                    <li class="separator">/</li>
                    <li><a href="cases.html">Cases</a></li>
                    <li class="separator">/</li>
                    <li class="current" id="breadcrumb-title">Report Details</li>
                </ol>
            </nav>

            <div class="report-header">
                <div class="report-meta">
                    <span class="report-tag">Deep Analysis Report</span>
                    <span class="report-date">Loading...</span>
                </div>
                <!-- Title will be injected by JS from Markdown H1 if available, or static here -->
                <h1 class="report-title">Loading Report...</h1>
            </div>

            <div class="report-container">
                <!-- Left: Table of Contents -->
                <aside class="report-sidebar">
                    <div class="toc-container">
                        <h3>Contents</h3>
                        <nav id="toc" class="toc-nav">
                            <!-- JS will inject TOC items here -->
                        </nav>
                    </div>
                </aside>

                <!-- Right: Markdown Content -->
                <article class="report-content" id="markdown-render">
                    <!-- JS will inject rendered HTML here -->
                    <div class="loading-state">
                        Loading report content...
                    </div>
                </article>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <div id="balance-payment-modal" class="modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div class="modal-content"
            style="background: white; padding: 2rem; border-radius: 1rem; max-width: 500px; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔒</div>
            <h2 style="margin-bottom: 0.5rem; color: #1e293b;">Unlock Full Report</h2>
            <p style="color: #64748b; margin-bottom: 2rem;">Please complete your payment to view the detailed analysis.
            </p>

            <div style="background: #f8fafc; padding: 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Remaining Balance</span>
                    <span style="font-weight: 600; font-size: 1.25rem;">$25.00</span>
                </div>
            </div>

            <button id="pay-balance-btn" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                Pay $25.00 & Unlock
            </button>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 1rem;">Secure Payment via Stripe</p>
        </div>
    </div>

    <script src="script_v2.js?v=5"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check for payment pending state
            const urlParams = new URLSearchParams(window.location.search);
            const paymentPending = urlParams.get('payment_pending');
            const balancePaid = urlParams.get('balance_paid') === 'true';
            const sessionId = urlParams.get('session_id');
            const reportId = urlParams.get('id');

            const modal = document.getElementById('balance-payment-modal');
            const content = document.querySelector('.report-container');
            const btn = document.getElementById('pay-balance-btn');

            function unlockReportView() {
                if (modal) modal.style.display = 'none';
                if (content) content.style.filter = 'none';
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?id=" + encodeURIComponent(reportId || "");
                window.history.replaceState({ path: newUrl }, '', newUrl);

                // Update SEO metadata if report data exists
                if (window.reportsData) {
                    const report = window.reportsData.find(r => r.id === reportId);
                    if (report) {
                        document.title = `${report.title} | Success Case | Amz AI Agent`;
                        document.getElementById('canonical-link').setAttribute('href', `https://amzaiagent.com/report.html?id=${report.id}`);
                    }
                }
            }

            if (paymentPending === 'true') {
                // Show modal and blur content
                if (modal) modal.style.display = 'flex';
                if (content) content.style.filter = 'blur(10px)';
            }

            if (balancePaid && sessionId) {
                fetch('/api/payments/verify-session?session_id=' + encodeURIComponent(sessionId))
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.status === 'paid') {
                            unlockReportView();
                        }
                    })
                    .catch(err => {
                        console.error('Payment verification failed:', err);
                    });
            }

            // Payment handler
            if (btn) {
                btn.addEventListener('click', async () => {
                    if (typeof window.trackEvent === 'function') {
                        window.trackEvent('legacy_report_balance_checkout_click', { path: window.location.pathname, report_id: reportId });
                    }
                    if (!reportId) {
                        alert('Report ID missing. Please reopen from your email link.');
                        return;
                    }

                    const originalText = btn.textContent;
                    btn.textContent = "Processing...";
                    btn.disabled = true;

                    try {
                        const successUrl = window.location.origin + `/report.html?id=${encodeURIComponent(reportId)}&balance_paid=true&session_id={CHECKOUT_SESSION_ID}`;
                        const cancelUrl = window.location.href;
                        const resp = await fetch('/api/proxy/create-checkout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                amount: '25.00',
                                order_id: reportId,
                                success_url: successUrl,
                                cancel_url: cancelUrl
                            })
                        });
                        if (!resp.ok) {
                            const err = await resp.json().catch(() => ({}));
                            throw new Error(err.detail || 'Payment service unavailable');
                        }
                        const data = await resp.json();
                        const paymentUrl = data.url || data.checkout_url || (Array.isArray(data) && data[0] && (data[0].url || data[0].checkout_url));
                        if (!paymentUrl) {
                            throw new Error('No payment URL returned');
                        }
                        if (typeof window.trackEvent === 'function') {
                            window.trackEvent('legacy_report_balance_checkout_redirect', { path: window.location.pathname, report_id: reportId });
                        }
                        window.location.href = paymentUrl;
                    } catch (err) {
                        alert('Payment Error: ' + err.message);
                        if (typeof window.trackEvent === 'function') {
                            window.trackEvent('legacy_report_balance_checkout_failed', { path: window.location.pathname, report_id: reportId, error: err.message });
                        }
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }
                });
            }

            const timestamp = new Date().getTime();

            // Function to load script with promise
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `${src}?v=${timestamp}`;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            // Load data first, then logic. 
            // We catch reports.js errors so report.js still loads (it has its own fallback).
            loadScript('data/reports/reports.js')
                .catch(err => {
                    console.warn('Offline reports data failed to load, falling back to fetch:', err);
                    return Promise.resolve();
                })
                .then(() => {
                    // SEO Update immediately after data load
                    if (window.reportsData && reportId) {
                        const report = window.reportsData.find(r => r.id === reportId);
                        if (report) {
                            document.title = `${report.title} | Amz AI Agent`;
                            const canonical = document.getElementById('canonical-link');
                            if (canonical) canonical.setAttribute('href', `https://amzaiagent.com/report.html?id=${report.id}`);
                        }
                    }
                    return loadScript('report.js');
                })
                .catch(err => {
                    console.error('Critical: Failed to load report logic:', err);
                    const container = document.querySelector('.report-container');
                    if (container) {
                        container.innerHTML = `
                            <div class="error-state" style="text-align: center; padding: 4rem; color: #dc2626;">
                                <p style="font-size: 1.25rem; margin-bottom: 1rem;">⚠️ Application Error: Failed to load report script.</p>
                                <p>Please check your internet connection and refresh the page.</p>
                                <a href="cases.html" style="color: #2563eb; text-decoration: underline;">Back to Case List</a>
                            </div>
                        `;
                    }
                });
        });
    </script>
    <script src='js/components.js'></script>
</body>

</html>
